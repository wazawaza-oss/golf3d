<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>コースデータのテスト</title>
<style>
  body{margin:0;padding:16px;font:15px/1.6 system-ui,-apple-system,"Hiragino Sans",sans-serif;background:#f0f1f4;color:#1b2430}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:6px 0;color:#3a4350}
  #sum{font-weight:900;font-size:17px;margin:8px 0}
  #sum.ok{color:#1f7a3a} #sum.ng{color:#b3261e}
  .row{display:flex;gap:8px;background:#fff;padding:7px 10px;border-top:1px solid #e3e5e9;font-size:14px}
  .row .m{flex:none;width:20px;font-weight:900}
  .row.ng{background:#fdecec} .row.ng .m{color:#b3261e} .row.ok .m{color:#1f7a3a}
</style>
<script>
  // the app's scripts read and write localStorage when they load: give them a stand-in so this page never touches the real data
  (function () {
    const mem = {};
    const fake = { getItem: k => k in mem ? mem[k] : null, setItem: (k, v) => { mem[k] = String(v); }, removeItem: k => { delete mem[k]; }, clear: () => Object.keys(mem).forEach(k => delete mem[k]) };
    Object.defineProperty(window, 'localStorage', { value: fake, configurable: true });
    // an old phone: the 18-hole course from before nines existed
    const holes = Array.from({ length: 18 }, (_, i) => ({ par: i % 9 === 2 ? 3 : 4, tee: i < 2 ? [139.1 + i * .001, 35.2] : null, green: i < 2 ? [139.1 + i * .001, 35.203] : null }));
    fake.setItem('golf3d.course', JSON.stringify({ name: '旧コース', center: [139.1, 35.2], holes }));
  })();
  window.compNines = () => null;  // from js/share.js (not loaded here)
</script>
<script src="../js/state.js"></script>
<script src="../js/geo.js"></script>
<script src="../js/cardjson.js"></script>
</head>
<body>
<h1>コースデータのテスト</h1>
<p>古い形式のコースを新しい形式に変換できるか、スコアカードのJSON（ダミー）を取り込めるかを確かめます。このページは本物の保存データには触りません。</p>
<div id="sum"></div>
<div id="log"></div>
<script>
"use strict";
const results = [];
const check = (label, ok) => results.push({ label, ok: !!ok });

/* 1. the old 18-hole course on this "phone" was converted when state.js loaded */
const saved = JSON.parse(localStorage.getItem('golf3d.course'));
check('古い18ホールのコースが OUT / IN の2ナインになる', S.course.nines.length === 2 && S.course.nines[0].name === 'OUT' && S.course.nines[1].name === 'IN');
check('1番・2番のティーとグリーンが残る', S.course.nines[0].holes[1].tee[0] === 139.101 && S.course.nines[0].holes[1].green[1] === 35.203);
check('パーが残る（3番 = パー3、12番 = パー3）', S.course.nines[0].holes[2].par === 3 && S.course.nines[1].holes[2].par === 3);
check('元のデータが golf3d.course.v1backup に1回だけ残る', JSON.parse(localStorage.getItem('golf3d.course.v1backup')).holes.length === 18);
check('変換したものが保存される', saved && saved.v === 2 && saved.nines.length === 2);
check('ティーの色がない古いデータには 青・白・赤（基準は白）が付く', S.course.tees.map(t => t.name).join() === '青,白,赤' && S.course.baseTee === 'white');

/* 2. the nine format from before tee colours (v2 without tees / yd) */
const v2 = { v: 2, name: '東西南', center: [139, 35], nines: ['東', '西', '南'].map((name, k) => ({ id: 'n' + k, name, holes: Array.from({ length: 9 }, (_, i) => ({ n: i + 1, par: 4, tee: null, green: null, src: 'manual', ok: false })) })) };
const c2 = toCourse(v2);
check('3つのナイン（東・西・南）がそのまま読める', c2 && c2.nines.map(x => x.name).join() === '東,西,南');
check('各ホールに空のヤード表が付く', c2.nines.every(x => x.holes.every(h => h.yd && !Object.keys(h.yd).length)));
check('範囲（area）がなければ null', c2.area === null);

/* 3. tee colours and yardages are kept; bad values are dropped */
const v3 = JSON.parse(JSON.stringify(v2));
v3.tees = [{ id: 'back', name: '黒', color: '#000000' }, { id: 'reg', name: '白', color: '#ffffff' }, { id: 'reg', name: '重複', color: '#ff0000' }, { id: 'lady', name: '赤', color: 'red' }];
v3.baseTee = 'reg';
v3.nines[0].holes[0].yd = { back: 410.4, reg: 380, lady: -5, gone: 300 };
v3.area = { bbox: [139, 35, 139.01, 35.01], osm: 'way/1', name: 'テストGC' };
const c3 = toCourse(v3);
check('色の数と基準の色が残る（同じidは1つに）', c3.tees.length === 3 && c3.baseTee === 'reg');
check('正しくない表示色は灰色になる', c3.tees[2].color === '#888888');
check('ヤードは整数に、負の値・消えた色は捨てる', JSON.stringify(c3.nines[0].holes[0].yd) === '{"back":410,"reg":380}');
check('範囲が残る', c3.area && c3.area.osm === 'way/1');
check('ナインの形でないデータは読み込まない', toCourse({ nines: [{ holes: [1, 2] }] }) === null && toCourse('x') === null);

/* 4. estimated tees and the plausibility check */
const tee = [139.1, 35.2], green = [139.1, 35.2 + 360 * YD / 111195];  // ~360 yards north
const h = { n: 1, par: 4, tee, green, src: 'manual', ok: true, yd: { back: 400, reg: 360 } };
const est = teeLL(h, 'back', c3);
check('バックティー（+40Y）は基準より40Y後ろに仮置きされる', Math.abs(yards(est, green) - 400) < 2);
check('ヤードが空欄の色は基準と同じ位置', teeLL(h, 'lady', c3) === tee);
check('距離が合っていれば「要確認」にならない', holeIssue(h, c3) === null && holeState(h, c3) === 'manual');
check('パー3で500mは「要確認」', !!holeIssue(Object.assign({}, h, { par: 3, green: [139.1, 35.2 + 500 / 111195] }), c3));
check('入力ヤードと地図が大きく違えば「要確認」', !!holeIssue(Object.assign({}, h, { yd: { reg: 250 } }), c3));
check('ティーかグリーンがなければ「未設定」', holeState(Object.assign({}, h, { tee: null }), c3) === 'none');

/* 5. HDCP is kept; older holes get null */
check('HDCPは1〜18だけ残り、ほかは null', toCourse(Object.assign({}, v2, { nines: v2.nines.map(x => ({ id: x.id, name: x.name, holes: x.holes.map((h, i) => Object.assign({}, h, { hdcp: [7, 0, 19, '3', 2.5][i] })) })) }))
  .nines[0].holes.slice(0, 5).map(h => h.hdcp).join() === '7,,,,' && c2.nines[0].holes[0].hdcp === null);

/* 6. score card JSON (schemaVersion 1) */
const PARS = [4, 3, 5, 4, 4, 3, 4, 5, 4];
const cardNine = (name, d) => ({ name, holes: PARS.map((par, i) => ({ no: i + 1, par, hdcp: i * 2 + 1, dist: { t1: [400, 180, 520, 390, 380, 160, 370, 510, 410][i] + d, t2: [380, 165, 500, 370, 360, 150, 350, 490, 390][i] + d } })),
  printedTotals: { par: 36 } });
const cardJ = { schemaVersion: 1, course: { name: 'テストCC', unit: 'yard', sourceUrl: null, tees: [{ id: 't1', label: 'バック' }, { id: 't2', label: 'レギュラー' }],
  nines: [cardNine('東', 0), cardNine('西', 5), cardNine('南', -5)] }, warnings: ['3番の距離がかすれていました'] };
const rd = readCard(JSON.stringify(cardJ));
check('3ナインのカードが読める', rd.card && rd.card.nines.length === 3 && !rd.errors.length);
check('```json で囲まれていても読める', readCard('```json\n' + JSON.stringify(cardJ) + '\n```').card !== null);
check('JSONでなければエラー', readCard('{"schemaVersion":').errors.length === 1);
check('schemaVersion 2 はエラー', !readCard(JSON.stringify(Object.assign({}, cardJ, { schemaVersion: 2 }))).card);
const bad8 = JSON.parse(JSON.stringify(cardJ)); bad8.course.nines[1].holes.pop();
check('ホールが9件でないとエラー', /8件/.test(readCard(JSON.stringify(bad8)).errors.join()));
const badT = JSON.parse(JSON.stringify(cardJ)); badT.course.nines[0].holes[0].dist.t9 = 300;
check('ティーにないidの距離はエラー', /t9/.test(readCard(JSON.stringify(badT)).errors.join()));
check('ティーがないとエラー', !readCard(JSON.stringify(Object.assign({}, cardJ, { course: Object.assign({}, cardJ.course, { tees: [] }) }))).card);
const shuf = JSON.parse(JSON.stringify(cardJ)); shuf.course.nines[0].holes.reverse();
check('番号順に並べ直す', readCard(JSON.stringify(shuf)).card.nines[0].holes[0].hdcp === 1);

const is0 = cardIssues(rd.card);
check('問題のないカードは AIのメモと出典なしの注意だけ', is0.list.length === 1 && /かすれ/.test(is0.list[0]) && is0.light.length === 1 && !is0.cells.size);
const w = readCard(JSON.stringify(cardJ)).card;
w.nines[0].holes[1].par = 6; w.nines[0].holes[2].dist.t1 = 900; w.nines[0].holes[3].dist.t2 = null; w.nines[1].totals.par = 35;
const is1 = cardIssues(w);
check('パー6・距離の目安外・空欄・印刷合計の違いに印が付く', ['0.1.par', '0.2.t.t1', '0.3.t.t2', '1.sum.par'].every(k => is1.cells.has(k)));
check('パー合計が34〜38の外なら印', is1.cells.has('0.sum.par'));
const wm = readCard(JSON.stringify(Object.assign({}, cardJ, { course: Object.assign({}, cardJ.course, { unit: 'meter' }) }))).card;
wm.nines[0].holes[0].dist.t1 = 950;
check('メートルのときは距離の目安を見ない', !cardIssues(wm).cells.has('0.0.t.t1'));

// over: the course's nines matched by name / order, positions kept, colours guessed
const base = blankCourse();
base.nines[1].name = '東'; base.nines[1].holes[0].tee = [139, 35]; base.nines[1].holes[0].green = [139, 35.003];
base.nines[0].holes[4].yd = { white: 999 };
const tmap = cardTeeMap(rd.card, base);
check('バック→青、レギュラー→白 に入る', tmap.t1 === 'blue' && tmap.t2 === 'white');
const ov = applyCard(base, rd.card, tmap, 'over');
check('上書き：名前が同じハーフ（東）に入り、位置は残る', ov.nines[1].name === '東' && ov.nines[1].id === base.nines[1].id && ov.nines[1].holes[0].tee[0] === 139 && ov.nines[1].holes[0].yd.white === 380);
check('上書き：残りのハーフ（OUT）は順番で西になり、南は追加', ov.nines[0].name === '西' && ov.nines[0].id === 'out' && ov.nines.length === 3 && ov.nines[2].name === '南');
check('上書き：パー・HDCPが入る', ov.nines[1].holes[1].par === 3 && ov.nines[1].holes[1].hdcp === 3);
check('上書き：元のコースは変わらない', base.nines[0].name === 'OUT' && base.nines[0].holes[4].yd.white === 999);
const blank = readCard(JSON.stringify(cardJ)).card; blank.nines[1].holes[4].dist.t2 = null; blank.nines[1].holes[4].hdcp = null;
const ov2 = applyCard(base, blank, tmap, 'over');
check('上書き：カードの空欄は今の値のまま', ov2.nines[0].holes[4].yd.white === 999 && ov2.nines[0].holes[4].hdcp === null);
check('上書き：地図に置く色はそのまま', ov.baseTee === 'white');
const ok = toCourse(JSON.parse(JSON.stringify(ov)));
check('上書きしたコースは保存の形として正しい（HDCPも残る）', ok && ok.nines.length === 3 && ok.nines[2].holes[8].hdcp === 17);

// new: the card's nines and colours only; meters become yards
const nw = applyCard(base, wm, { t1: 'new', t2: 'new' }, 'new');
check('別のコース：カードの3ハーフだけ、位置なし', nw.nines.map(x => x.name).join() === '東,西,南' && !nw.nines.some(x => x.holes.some(h => h.tee)));
check('別のコース：色はバック（青）・レギュラー（白）、地図に置く色はレギュラー', nw.tees.map(t => t.name + t.color).join() === 'バック#1f5fd1,レギュラー#ffffff' && nw.tees[1].id === nw.baseTee);
check('別のコース：メートルはヤードに換算（380m → 416Y）', nw.nines[0].holes[0].yd[nw.baseTee] === 416);
check('別のコース：950m（1039Y）は入れない', !(nw.tees[0].id in nw.nines[0].holes[0].yd));

/* show the results */
const bad = results.filter(r => !r.ok).length;
const sum = document.getElementById('sum');
sum.textContent = bad ? `${bad}件の失敗（全${results.length}件）` : `すべて合格（${results.length}件）`;
sum.className = bad ? 'ng' : 'ok';
results.forEach(r => {
  const d = document.createElement('div'); d.className = 'row ' + (r.ok ? 'ok' : 'ng');
  d.innerHTML = `<span class="m">${r.ok ? '✓' : '✗'}</span>`; d.append(r.label);
  document.getElementById('log').appendChild(d);
});
</script>
</body>
</html>
