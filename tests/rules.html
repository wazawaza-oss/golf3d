<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ルールの確認テスト</title>
<style>
  body{margin:0;padding:16px;font:15px/1.6 system-ui,-apple-system,"Hiragino Sans",sans-serif;background:#f0f1f4;color:#1b2430}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:6px 0;color:#3a4350}
  button{font:inherit;font-weight:800;padding:12px 18px;border:none;border-radius:12px;background:#16592f;color:#fff;margin:10px 0}
  button:disabled{background:#8a909a}
  #sum{font-weight:900;font-size:17px;margin:8px 0}
  #sum.ok{color:#1f7a3a} #sum.ng{color:#b3261e}
  h2{font-size:14px;margin:18px 0 6px;color:#3a4350}
  .row{display:flex;gap:8px;align-items:baseline;background:#fff;padding:7px 10px;border-top:1px solid #e3e5e9;font-size:14px}
  .row .m{flex:none;width:20px;font-weight:900}
  .row .l{flex:1}
  .row .r{flex:none;font-size:12.5px;color:#3a4350}
  .row.ng{background:#fdecec}
  .row.ng .m{color:#b3261e} .row.ok .m{color:#1f7a3a}
</style>
</head>
<body>
<h1>データベースのルール確認</h1>
<p>本物のFirebaseに、テスト用の小さなコンペを作ります。主催者・カート代表・参加者・部外者として順に操作し（代表の交代や組の移動も試します）、許されるべき操作は通り、禁止されるべき操作は断られるかを確かめます。</p>
<p>2分ほどかかります。最後にテスト用のコンペとテスト用の利用者は自動で消えます（途中で閉じても、コンペは数分で期限切れになり、アプリが片付けます）。</p>
<button id="run">テストを始める</button>
<div id="sum"></div>
<div id="log"></div>

<script type="module">
// tests firebase-rules.json as published: separate anonymous users act each role against a short-lived competition
const SDK = 'https://www.gstatic.com/firebasejs/12.4.0/';
const CFG = {  // same as js/comp.js
  apiKey: 'AIzaSyD4ZvWQsx_0xXq7KJL4V123kdl8L3N2xPM',
  authDomain: 'golfscoreapp-f2d31.firebaseapp.com',
  databaseURL: 'https://golfscoreapp-f2d31-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'golfscoreapp-f2d31',
  appId: '1:513780302035:web:155d3e482323ebebf2d426'
};
const LIFE = 75000;  // the test competition expires this long after it is made, so the expiry rules can be tried too
const B62 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => B62[b % 62]).join('');
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const timeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms))]);

let A, Au, D, pass = 0, fail = 0;
const users = [];
async function user(name) {
  const app = A.initializeApp(CFG, `${name}-${rid(6)}`);
  const auth = Au.initializeAuth(app, { persistence: Au.inMemoryPersistence });  // each one is a separate phone
  const cred = await Au.signInAnonymously(auth);
  const u = { name, app, uid: cred.user.uid, user: cred.user, db: D.getDatabase(app) };
  users.push(u); return u;
}
const ref = (u, p) => p ? D.ref(u.db, p) : D.ref(u.db);  // '' = the database root

function section(t) { $('log').appendChild(Object.assign(document.createElement('h2'), { textContent: t })); }
async function check(label, expect, fn) {
  let got;
  try { await timeout(fn(), 12000); got = 'allow'; }
  catch (e) { got = /permission/i.test(String(e.code || e.message)) ? 'deny' : 'エラー: ' + e.message; }
  const ok = got === expect; ok ? pass++ : fail++;
  const row = document.createElement('div'); row.className = 'row ' + (ok ? 'ok' : 'ng');
  row.innerHTML = `<span class="m">${ok ? '✔' : '✖'}</span><span class="l"></span><span class="r"></span>`;
  row.querySelector('.l').textContent = label;
  row.querySelector('.r').textContent = `期待: ${expect === 'allow' ? '通る' : '断られる'}／結果: ${got === 'allow' ? '通った' : got === 'deny' ? '断られた' : got}`;
  $('log').appendChild(row);
  $('sum').textContent = `確認中… ${pass + fail}件`;
}
const allow = (l, fn) => check(l, 'allow', fn), deny = (l, fn) => check(l, 'deny', fn);

async function run() {
  [A, Au, D] = await Promise.all(['app', 'auth', 'database'].map(m => import(`${SDK}firebase-${m}.js`)));
  $('sum').textContent = 'テスト用の利用者を準備中…';
  // p1 = 青木 (1組), p2 = 馬場 (1組), p3 = 千葉 (2組); the organizer picks each team's lead in the roster
  const [org, org2, p1, p2, p3, out] = await Promise.all(['主催者', '主催者2', '青木', '馬場', '千葉', '部外者'].map(user));
  const cid = rid(10), now = Date.now(), exp = now + LIFE, C = `comps/${cid}`;
  const pa = 'pTeam1Aaa', pb = 'pTeam1Bbb', pc = 'pTeam2Ccc';
  const kP = rid(22), kO = rid(22);
  const meta = { name: 'ルール確認テスト', date: '2026-01-01', owner: org.uid, created: now, expires: exp };
  // a score as the app writes it: who wrote it (phone and name) and when
  const score = (u, bp, v = 4, extra) => Object.assign({ v, by: u.uid, bp, t: Date.now() }, extra);
  const sc = (u, pid, h, bp, v) => D.set(ref(u, `${C}/scores/${pid}/${h}`), score(u, bp, v));
  const join = (u, key, role) => D.update(ref(u, `${C}/members/${u.uid}`), { role, key, t: Date.now() });
  const pick = (u, pid) => D.update(ref(u, C), { [`taken/${pid}`]: u.uid, [`members/${u.uid}/player`]: pid });

  section('コンペを作る');
  const cx = rid(10);
  await deny('コンペの期限と違う日付で片付け用の記録を作る', () => D.update(ref(out, ''), { [`comps/${cx}/meta`]: Object.assign({}, meta, { owner: out.uid }), [`expiry/${cx}`]: exp + 864e5 }));
  await allow('主催者がコンペを作る', () => D.update(ref(org, ''), { [`${C}/meta`]: meta, [`${C}/members/${org.uid}`]: { role: 'org', key: 'owner', t: now }, [`expiry/${cid}`]: exp }));
  await deny('部外者が「作った人」として主催者になる', () => join(out, 'owner', 'org'));
  await allow('主催者がコース・名簿・リンクの鍵を入れる', () => D.update(ref(org, C), {
    course: { club: 'テスト', nines: [0, 1].map(k => ({ name: k ? 'IN' : 'OUT', holes: Array.from({ length: 9 }, () => ({ par: 4 })) })) },
    [`roster/${pa}`]: { name: '青木', team: 1 }, [`roster/${pb}`]: { name: '馬場', team: 1 }, [`roster/${pc}`]: { name: '千葉', team: 2 },
    [`invites/${kP}`]: { role: 'player', t: now }, [`invites/${kO}`]: { role: 'org', t: now }
  }));
  await deny('カート代表用のリンクの鍵を作る（もう使わない）', () => D.set(ref(org, `${C}/invites/${rid(22)}`), { role: 'cart', team: 1, t: now }));

  section('部外者（リンクを持っていない人）');
  await deny('コンペの情報を読む', () => D.get(ref(out, `${C}/meta`)));
  await deny('名簿・代表を読む', () => Promise.any([D.get(ref(out, `${C}/roster`)), D.get(ref(out, `${C}/leads`))]).catch(e => { throw e.errors ? e.errors[0] : e; }));
  await deny('スコアを読む', () => D.get(ref(out, `${C}/scores`)));
  await deny('リンクの鍵を読む', () => D.get(ref(out, `${C}/invites`)));
  await deny('でたらめな鍵で参加する', () => join(out, rid(22), 'player'));
  await deny('参加者用の鍵で主催者になる', () => join(out, kP, 'org'));
  await deny('スコアを書く', () => sc(out, pa, 'h01', 'org'));
  await deny('代表を決める', () => D.set(ref(out, `${C}/leads/t1`), pa));

  section('参加者用リンクで参加する');
  for (const u of [p1, p2, p3]) await allow(`${u.name}さんが参加する`, () => join(u, kP, 'player'));
  await allow('引き継ぎリンクで2台目の主催者が参加する', () => join(org2, kO, 'org'));
  await allow('参加者がコンペ・名簿・代表・スコアを読む', () => Promise.all(['meta', 'roster', 'leads', 'scores', 'course', 'pins', 'taken'].map(p => D.get(ref(p1, `${C}/${p}`)))));
  await deny('参加者がリンクの鍵を読む', () => D.get(ref(p1, `${C}/invites`)));
  await deny('参加者が参加者の一覧（スマホ）を読む', () => D.get(ref(p1, `${C}/members`)));

  section('代表を決める（主催者だけ）');
  await allow('主催者が青木さんを1組の代表にする（名前を選ぶ前でもよい）', () => D.set(ref(org, `${C}/leads/t1`), pa));
  await deny('組の違う代表を書く（青木さんを2組の代表に）', () => D.set(ref(org, `${C}/leads/t2`), pa));
  await deny('名簿にいない人を代表にする', () => D.set(ref(org, `${C}/leads/t2`), 'pNobody00'));
  await deny('参加者が自分を代表にする', () => D.set(ref(p2, `${C}/leads/t1`), pb));
  await deny('参加者が代表を外す', () => D.remove(ref(p2, `${C}/leads/t1`)));
  await deny('参加者が自分の組を変える', () => D.set(ref(p2, `${C}/roster/${pb}/team`), 2));
  await deny('参加者が名前を書きかえる', () => D.set(ref(p2, `${C}/roster/${pb}/name`), '改名'));
  await deny('参加者がコースを書きかえる', () => D.set(ref(p2, `${C}/course/club`), '別'));
  await deny('参加者がピン位置を置く', () => D.set(ref(p2, `${C}/pins/h01`), [139, 35]));

  section('名前を選ぶ');
  await deny('代表に決まった青木さんも、名前を選ぶ前は書けない', () => sc(p1, pb, 'h01', pa));
  await allow('青木さんが「青木」を選ぶ', () => pick(p1, pa));
  await deny('馬場さんも「青木」を選ぶ', () => pick(p2, pa));
  await allow('馬場さんが「馬場」を選ぶ', () => pick(p2, pb));
  await allow('千葉さんが「千葉」を選ぶ', () => pick(p3, pc));
  await deny('青木さんが「千葉」に乗りかえる', () => pick(p1, pc));
  await deny('青木さんが選んだ名前を消す', () => D.remove(ref(p1, `${C}/members/${p1.uid}/player`)));
  await deny('リンクを開き直したついでに名前を消す', () => D.set(ref(p1, `${C}/members/${p1.uid}`), { role: 'player', key: kP, t: Date.now() }));

  section('1組の代表（青木さん）');
  await allow('自分のスコアを書く', () => sc(p1, pa, 'h01', pa, 5));
  await allow('同じ組の馬場さんのスコアを書く', () => sc(p1, pb, 'h01', pa, 4));
  await allow('同じ組の馬場さんのスコアを消す', () => D.remove(ref(p1, `${C}/scores/${pb}/h01`)));
  await deny('2組の千葉さんのスコアを書く', () => sc(p1, pc, 'h01', pa));
  await deny('書いた人を馬場さんと偽る', () => sc(p1, pb, 'h02', pb));
  await deny('書いた人を主催者と偽る', () => sc(p1, pb, 'h02', 'org'));
  await deny('書いたスマホを偽る', () => D.set(ref(p1, `${C}/scores/${pb}/h02`), { v: 4, by: org.uid, bp: pa, t: Date.now() }));
  await deny('ありえない打数（25）を書く', () => sc(p1, pb, 'h02', pa, 25));
  await deny('ずっと先の時刻で書く', () => D.set(ref(p1, `${C}/scores/${pb}/h02`), score(p1, pa, 4, { t: Date.now() + 864e5 })));
  await allow('直した印を付けて書く', () => D.set(ref(p1, `${C}/scores/${pb}/h03`), score(p1, pa, 6, { fix: true })));
  await deny('代表が別の人を代表にする', () => D.set(ref(p1, `${C}/leads/t2`), pc));

  section('一般の参加者（馬場さん・千葉さん）');
  await allow('馬場さんが自分のスコアを書く', () => sc(p2, pb, 'h04', pb));
  await deny('馬場さんが同じ組の青木さんのスコアを書く', () => sc(p2, pa, 'h04', pb));
  await deny('千葉さんが1組のスコアを書く', () => sc(p3, pb, 'h04', pc));

  section('代表の交代・組の移動（すぐに効く）');
  await allow('主催者が1組の代表を馬場さんに替える', () => D.set(ref(org, `${C}/leads/t1`), pb));
  await deny('外された青木さんは、馬場さんのスコアを書けない', () => sc(p1, pb, 'h05', pa));
  await allow('外された青木さんも、自分のスコアは書ける', () => sc(p1, pa, 'h05', pa));
  await allow('新しい代表の馬場さんが青木さんのスコアを書く', () => sc(p2, pa, 'h05', pb, 3));
  await allow('主催者が代表の馬場さんを2組に移す（代表欄はそのまま）', () => D.set(ref(org, `${C}/roster/${pb}/team`), 2));
  await deny('移された馬場さんは、前の組の青木さんのスコアを書けない', () => sc(p2, pa, 'h06', pb));
  await deny('移された馬場さんは、2組の代表でもない', () => sc(p2, pc, 'h06', pb));
  await allow('主催者が古い代表欄を消し、馬場さんを2組の代表にする', () => D.update(ref(org, C), { 'leads/t1': null, 'leads/t2': pb }));
  await allow('2組の代表の馬場さんが千葉さんのスコアを書く', () => sc(p2, pc, 'h06', pb));
  await deny('代表のいない1組の青木さんは、ほかの人の分を書けない', () => sc(p1, pb, 'h07', pa));

  section('主催者');
  await allow('誰のスコアでも書ける', () => sc(org, pc, 'h08', 'org', 6));
  await deny('書いた人を名簿の人と偽る', () => sc(org, pc, 'h08', pa));
  await allow('2台目の主催者も名簿と代表を直せる', () => D.update(ref(org2, C), { [`roster/${pc}/name`]: '千葉さん', 'leads/t1': pa }));
  await allow('参加者の一覧と鍵を読む', () => Promise.all([D.get(ref(org, `${C}/members`)), D.get(ref(org, `${C}/invites`))]));
  await allow('「青木」の選択を解除する', () => D.update(ref(org, C), { [`taken/${pa}`]: null, [`members/${p1.uid}/player`]: null }));
  await deny('解除された青木さんは、代表でももう書けない', () => sc(p1, pa, 'h09', pa));
  await deny('コンペの期限を延ばす', () => D.update(ref(org, `${C}/meta`), { expires: exp + 864e5 }));
  await deny('コンペの基本情報を消す', () => D.remove(ref(org, `${C}/meta`)));
  await deny('期限前にコンペごと消す', () => D.remove(ref(org, C)));
  await deny('部外者が期限前にコンペを消す', () => D.update(ref(out, ''), { [C]: null, [`expiry/${cid}`]: null }));

  section('期限が過ぎたあと');
  const wait = exp - Date.now() + 3000;
  for (let left = wait; left > 0; left -= 1000) { $('sum').textContent = `期限切れを待っています… あと${Math.ceil(left / 1000)}秒`; await sleep(Math.min(1000, left)); }
  await deny('主催者が名簿を直す', () => D.set(ref(org, `${C}/roster/${pa}/name`), '改名'));
  await deny('主催者が代表を替える', () => D.set(ref(org, `${C}/leads/t2`), pc));
  await deny('主催者がスコアを書く', () => sc(org, pa, 'h10', 'org'));
  await deny('代表がスコアを書く', () => sc(p2, pc, 'h10', pb));
  await deny('参加者が自分のスコアを書く', () => sc(p3, pc, 'h11', pc));
  await deny('新しい人がリンクで参加する', () => join(out, kP, 'player'));
  await allow('参加者はまだ結果を読める', () => D.get(ref(p3, `${C}/scores`)));
  await allow('誰でも期限切れのコンペを片付けられる', () => D.update(ref(out, ''), { [C]: null, [`expiry/${cid}`]: null }));
}

async function cleanup() {
  for (const u of users) { try { await u.user.delete(); } catch (e) {} try { await A.deleteApp(u.app); } catch (e) {} }
  users.length = 0;
}

$('run').onclick = async () => {
  $('run').disabled = true; $('log').textContent = ''; pass = fail = 0; $('sum').className = '';
  try { await run(); } catch (e) { fail++; $('log').appendChild(Object.assign(document.createElement('p'), { textContent: '途中で止まりました: ' + e.message })); }
  await cleanup();
  $('sum').textContent = fail ? `✖ ${fail}件がおかしい（${pass + fail}件中）` : `✔ すべて期待どおり（${pass}件）`;
  $('sum').className = fail ? 'ng' : 'ok';
  $('run').disabled = false;
};
</script>
</body>
</html>
